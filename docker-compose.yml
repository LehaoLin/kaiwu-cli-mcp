services:
  kaiwu:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${KAIWU_IMAGE_NAME:-kaiwu-sdk:latest}
    container_name: ${KAIWU_CONTAINER_NAME:-kaiwu-sdk}
    working_dir: /workspace
    volumes:
      # 映射用户脚本目录（用户在宿主机编辑，Docker 中运行）
      - ./user_script:/user_script:rw
      # 映射用户配置文件（只读）
      - ./user_config.yaml:/workspace/user_config.yaml:ro
      # 持久化 SDK license（--rm 会删除容器，named volume 保留 license 文件）
      # 注意：路径需与 SDK 的 _LICENSE_FILE 一致，如有差异请调整此挂载路径
      - kaiwu-license:/root/.kaiwu
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace:/user_script
    stdin_open: true
    tty: true
    command: python3

volumes:
  kaiwu-license:
